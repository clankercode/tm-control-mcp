name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    name: pytest (no game)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest

      - name: Unit tests (call.py wait helpers)
        run: python -m pytest tests/test_call_wait.py -q

      - name: Syntax-check call.py
        run: python -m py_compile tools/call.py
