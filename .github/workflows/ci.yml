name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  pytest:
    name: pytest (no game)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest

      - name: Check out pinned AngelScript SDK for production-policy tests
        uses: actions/checkout@v4
        with:
          repository: XertroV/angelscript
          ref: 0b8dacb8acac4e844a312c4405f124d97fc33af0
          path: .test-deps/angelscript

      - name: Build AngelScript
        run: |
          cmake -S .test-deps/angelscript/sdk/angelscript/projects/cmake -B /tmp/tcm-angelscript-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_ARCHIVE_OUTPUT_DIRECTORY="$GITHUB_WORKSPACE/.test-deps/angelscript/sdk/angelscript/lib"
          cmake --build /tmp/tcm-angelscript-build --parallel 2

      - name: Unit tests (offline)
        env:
          ANGELSCRIPT_ROOT: ${{ github.workspace }}/.test-deps/angelscript
          TCM_REQUIRE_ANGELSCRIPT: '1'
        run: python -m pytest tests -q

      - name: Syntax-check call.py
        run: python -m py_compile tools/call.py

  windows-client:
    name: Python client (native Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Client adapter and wait tests
        run: python -m pytest tests/test_call_process.py tests/test_call_wait.py -q
      - name: Exercise native tasklist without a game
        run: python -c "import sys; sys.path.insert(0, 'tools'); import call; assert isinstance(call.find_trackmania_pids(), list)"
