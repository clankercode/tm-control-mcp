name: MCP CLI manual release verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mcp-cli/**"
      - "packaging/**"
      - "tools/mcp-cli-remote.sh"
      - ".github/workflows/mcp-cli.yml"

permissions:
  contents: read

jobs:
  source-verification:
    name: Verify launcher and package metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify npm package metadata
        run: python3 packaging/verify-mcp-cli-artifacts.py --source-only
      - name: Test launcher logic
        run: node --test mcp-cli/npm/test/*.test.mjs

  rust-linux:
    name: Build and test Linux x64 on remote runner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl linker
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Check and test
        run: |
          cargo fmt --manifest-path mcp-cli/Cargo.toml --all -- --check
          cargo test --manifest-path mcp-cli/Cargo.toml --locked
      - name: Build release binary
        run: cargo build --manifest-path mcp-cli/Cargo.toml --release --locked --target x86_64-unknown-linux-musl
      - name: Verify package metadata
        run: python3 packaging/verify-mcp-cli-artifacts.py --source-only

  rust-windows:
    name: Build Windows x64 binary on remote runner
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Check and test
        shell: bash
        run: |
          cargo fmt --manifest-path mcp-cli/Cargo.toml --all -- --check
          cargo test --manifest-path mcp-cli/Cargo.toml --locked
          cargo build --manifest-path mcp-cli/Cargo.toml --release --locked --target x86_64-pc-windows-msvc

  package-contract:
    name: Verify package contract
    runs-on: ubuntu-latest
    needs: [source-verification, rust-linux, rust-windows]
    steps:
      - uses: actions/checkout@v4
      - name: Verify package metadata and launch tests
        run: |
          python3 packaging/verify-mcp-cli-artifacts.py --source-only
          node --test mcp-cli/npm/test/*.test.mjs
